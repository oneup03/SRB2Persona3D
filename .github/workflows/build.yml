name: Build & release

on:
  push:
    branches: [srb2p_22]
    tags:
      - 'v*'
      - 'SRB2P-exe-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # The x86 build assembles tmap*.nas via a CustomBuild step that shells
      # out to `nasm` (SRB2_common.props). build.ps1 would otherwise fetch a
      # portable copy itself, but the action is faster and cached.
      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      # build.ps1 is the same script the VS Code build task runs, so CI and
      # local builds cannot drift. It builds Release|Win32 and stages exe +
      # runtime DLLs + game data into deploy\Release.
      - name: Build and stage
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Version string lives on the first line of src/version.h.
          $verLine = Get-Content src/version.h -TotalCount 1
          if ($verLine -notmatch '"([0-9][0-9.]*)"') { throw "Could not parse version from src/version.h" }
          $version = $Matches[1]
          $short   = $env:GITHUB_SHA.Substring(0, 7)

          $zip = "SRB2Persona-$version-$short-Win32.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path 'deploy\Release\*' -DestinationPath $zip

          "zip=$zip"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Packaged $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRB2Persona-Win32
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

      # Rolling pre-release: recreated on every push to the primary branch so
      # `latest` always points at a build of the current tip.
      - name: Publish rolling 'latest' pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/srb2p_22'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ steps.pkg.outputs.zip }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -e
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Automatic Windows build of SRB2 Persona v$VERSION from commit $GITHUB_SHA.

          The zip is self-contained: freshly built \`SRB2Persona.exe\`, the SDL2 /
          audio runtime DLLs, and the v1.3.6 game data. Unzip anywhere and run
          \`SRB2Persona.exe\`.
          EOF

          gh release create latest \
            --prerelease \
            --title "Latest SRB2 Persona build" \
            --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/notes.md"

          gh release upload latest "$ZIP" --clobber

      # Tag pushes get a permanent, non-prerelease release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
