name: Build & release

# Cross-compiles the 64-bit Windows build with MinGW-w64 on a Linux runner
# (same toolchain as a local git-bash build, just prefixed), zips the staged
# game folder, and publishes it to a rolling `latest` pre-release on pushes to
# the primary branch. Tag pushes get a permanent release instead.

on:
  push:
    branches: [srb2p_22]
    tags:
      - 'v*'
      - 'SRB2P-exe-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The LeiaSR shim is MSVC-only (the SR SDK ships MSVC import libs and a C++
  # weaver with virtual inheritance), so it can't come out of the MinGW cross
  # build below. It gets its own Windows runner and is handed over as an
  # artifact. continue-on-error because the shim is genuinely optional: without
  # it the engine's runtime loader reports LeiaSR unavailable and that mode
  # falls back to plain Side-by-Side, so a shim failure must not sink the zip.
  shim:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # bo3b/SR-lib is a PRIVATE repository, so this needs a PAT with read
      # access to it, stored as the SHARED_PAT repository secret (SUBMODULE_PAT
      # is accepted as a fallback name). Without
      # one the job skips the shim and the Windows zip simply ships without
      # LeiaSR -- every other stereo mode is unaffected, and at runtime the
      # engine reports LeiaSR unavailable and falls back to Side-by-Side.
      #
      # Two auth details, both load-bearing:
      #  - actions/checkout writes an http.https://github.com/.extraheader
      #    token scoped to THIS repo into .git/config, and git applies it to
      #    every github.com URL. It 401s on a third-party repo, so it has to
      #    come out first.
      #  - The credential rewrite has to be GLOBAL, not --local and not `git -c`.
      #    submodule update spawns a separate `git clone` for the submodule, and
      #    that child process reads global/system config plus its own (not-yet-
      #    existing) repo config -- it never sees the parent's local config, so a
      #    --local insteadOf rewrite is silently ignored and the clone falls back
      #    to unauthenticated, which on a private repo means a credential prompt.
      - name: Fetch SR-lib
        id: srlib
        shell: bash
        env:
          SUBMODULE_PAT: ${{ secrets.SHARED_PAT || secrets.SUBMODULE_PAT }}
        run: |
          if [ -z "$SUBMODULE_PAT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SHARED_PAT/SUBMODULE_PAT secret; skipping the LeiaSR shim. bo3b/SR-lib is private, so CI cannot fetch the SR SDK. The Windows zip will ship without LeiaSR support."
            exit 0
          fi

          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init libs/SR-lib
          git config --global --remove-section url."https://x-access-token:${SUBMODULE_PAT}@github.com/" || true

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build shim
        if: steps.srlib.outputs.available == 'true'
        run: |
          cmake -S leiasr_shim -B leiasr_shim/build -A x64
          cmake --build leiasr_shim/build --config Release

      - name: Upload shim
        if: steps.srlib.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leiasr-shim
          path: leiasr_shim/build/Release/leiasr_shim.dll
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    # always() so a failed/skipped shim job still lets the zip build.
    needs: shim
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 zip

      # build.sh stages any leiasr_shim.dll it finds at this path. Missing is
      # fine -- LeiaSR then reports unavailable at runtime and falls back.
      - name: Fetch shim artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: leiasr-shim
          path: leiasr_shim/build/Release

      # build.sh is the same script the VS Code build task runs, so CI and
      # local builds can't drift. It picks up the x86_64-w64-mingw32-* tools
      # automatically when cross-compiling. --no-shim because the shim is MSVC
      # and this runner is Linux; the job above already built it.
      - name: Build and stage
        run: bash build.sh --no-shim

      - name: Package
        id: pkg
        run: |
          set -e
          # Version string lives on the first line of src/version.h.
          VERSION=$(sed -n '1s/.*"\([0-9][0-9.]*\)".*/\1/p' src/version.h)
          [ -n "$VERSION" ] || { echo "::error::could not parse version from src/version.h"; exit 1; }
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)

          ZIP="SRB2Persona-${VERSION}-${SHORT}-Win64.zip"
          (cd deploy/Release && zip -qr "../../$ZIP" .)

          echo "zip=$ZIP"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaged $ZIP ($(du -h "$ZIP" | cut -f1))"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRB2Persona-Win64
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

      # Rolling pre-release: recreated on every push to the primary branch so
      # `latest` always points at a build of the current tip.
      - name: Publish rolling 'latest' pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/srb2p_22'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ steps.pkg.outputs.zip }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -e
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          cat > /tmp/notes.md <<EOF
          Automatic 64-bit Windows build of SRB2 Persona v$VERSION from commit $GITHUB_SHA.

          Built with MinGW-w64, the toolchain this fork targets. The zip is
          self-contained: \`SRB2Persona.exe\`, the SDL2/audio runtime DLLs, and
          the v1.3.6 game data. Unzip anywhere and run \`SRB2Persona.exe\`.
          EOF

          gh release create latest \
            --prerelease \
            --title "Latest SRB2 Persona build" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/notes.md

          gh release upload latest "$ZIP" --clobber

      # Tag pushes get a permanent, non-prerelease release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
