name: Build & release

# Cross-compiles the 64-bit Windows build with MinGW-w64 on a Linux runner
# (same toolchain as a local git-bash build, just prefixed), zips the staged
# game folder, and publishes it to a rolling `latest` pre-release on pushes to
# the primary branch. Tag pushes get a permanent release instead.

on:
  push:
    branches: [srb2p_22]
    tags:
      - 'v*'
      - 'SRB2P-exe-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 zip

      # build.sh is the same script the VS Code build task runs, so CI and
      # local builds can't drift. It picks up the x86_64-w64-mingw32-* tools
      # automatically when cross-compiling.
      - name: Build and stage
        run: bash build.sh

      - name: Package
        id: pkg
        run: |
          set -e
          # Version string lives on the first line of src/version.h.
          VERSION=$(sed -n '1s/.*"\([0-9][0-9.]*\)".*/\1/p' src/version.h)
          [ -n "$VERSION" ] || { echo "::error::could not parse version from src/version.h"; exit 1; }
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)

          ZIP="SRB2Persona-${VERSION}-${SHORT}-Win64.zip"
          (cd deploy/Release && zip -qr "../../$ZIP" .)

          echo "zip=$ZIP"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaged $ZIP ($(du -h "$ZIP" | cut -f1))"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRB2Persona-Win64
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

      # Rolling pre-release: recreated on every push to the primary branch so
      # `latest` always points at a build of the current tip.
      - name: Publish rolling 'latest' pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/srb2p_22'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ steps.pkg.outputs.zip }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -e
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          cat > /tmp/notes.md <<EOF
          Automatic 64-bit Windows build of SRB2 Persona v$VERSION from commit $GITHUB_SHA.

          Built with MinGW-w64, the toolchain this fork targets. The zip is
          self-contained: \`SRB2Persona.exe\`, the SDL2/audio runtime DLLs, and
          the v1.3.6 game data. Unzip anywhere and run \`SRB2Persona.exe\`.
          EOF

          gh release create latest \
            --prerelease \
            --title "Latest SRB2 Persona build" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/notes.md

          gh release upload latest "$ZIP" --clobber

      # Tag pushes get a permanent, non-prerelease release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
